name: Frontend CI

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  ci:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --passWithNoTests --forceExit

      - name: API types drift check
        run: |
          npm run gen:api
          git diff --exit-code types/api.generated.ts || \
            (echo "::error::api.generated.ts está desatualizado. Rode 'npm run gen:api' localmente e commite o resultado." && exit 1)
